name: Build Snap Paint III APK and APP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

env:
  APP_NAME: "Snap Paint III"
  APP_ID: com.example.snappaintiii
  WEB_DIR: www

jobs:
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android SDK licenses
        run: |
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare web assets
        run: |
          mkdir -p "$WEB_DIR"

          if [ ! -f "$WEB_DIR/index.html" ]; then
            if [ -f index.html ]; then
              cp index.html "$WEB_DIR/"
            else
              printf '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<title>%s</title>\n</head>\n<body>\n<h1>%s</h1>\n</body>\n</html>\n' "$APP_NAME" "$APP_NAME" > "$WEB_DIR/index.html"
            fi
          fi

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.json ]; then
            printf '{\n  "appId": "%s",\n  "appName": "%s",\n  "webDir": "%s"\n}\n' "$APP_ID" "$APP_NAME" "$WEB_DIR" > capacitor.config.json
          fi

      - name: Install Capacitor dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

      - name: Add or sync Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set Android app name
        run: |
          STRINGS=android/app/src/main/res/values/strings.xml

          if [ -f "$STRINGS" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|" "$STRINGS"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk SnapPaintIII.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapPaintIII-android
          path: SnapPaintIII.apk
          retention-days: 30

  build-ios-app:
    name: Build iOS .app
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare web assets
        run: |
          mkdir -p "$WEB_DIR"

          if [ ! -f "$WEB_DIR/index.html" ]; then
            if [ -f index.html ]; then
              cp index.html "$WEB_DIR/"
            else
              printf '<!doctype html>\n<html>\n<head>\n<meta charset="utf-8">\n<title>%s</title>\n</head>\n<body>\n<h1>%s</h1>\n</body>\n</html>\n' "$APP_NAME" "$APP_NAME" > "$WEB_DIR/index.html"
            fi
          fi

      - name: Create Capacitor config if missing
        run: |
          if [ ! -f capacitor.config.json ]; then
            printf '{\n  "appId": "%s",\n  "appName": "%s",\n  "webDir": "%s"\n}\n' "$APP_ID" "$APP_NAME" "$WEB_DIR" > capacitor.config.json
          fi

      - name: Install Capacitor dependencies
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          npm install @capacitor/core@6 @capacitor/ios@6
          npm install --save-dev @capacitor/cli@6

      - name: Add or sync iOS platform
        run: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi

          npx cap sync ios

      - name: Set iOS display name
        run: |
          PLIST=ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName \"$APP_NAME\"" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string \"$APP_NAME\"" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleName \"$APP_NAME\"" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :CFBundleName string \"$APP_NAME\"" "$PLIST"

      - name: Build iOS Simulator .app
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_ID"

      - name: Package .app
        run: |
          set -e

          SOURCE_APP=$(find ios/App/build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n 1)

          if [ -z "$SOURCE_APP" ]; then
            echo "No .app build output found."
            exit 1
          fi

          mkdir -p dist
          rm -rf dist/SnapPaintIII.app dist/SnapPaintIII.app.zip

          cp -R "$SOURCE_APP" dist/SnapPaintIII.app

          cd dist
          ditto -c -k --sequesterRsrc --keepParent SnapPaintIII.app SnapPaintIII.app.zip

      - name: Upload iOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapPaintIII-ios
          path: dist/SnapPaintIII.app.zip
          retention-days: 30
